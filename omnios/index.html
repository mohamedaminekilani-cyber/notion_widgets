<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0f11">
<meta name="description" content="OmniOS — an integrated personal life operating system.">
<title>OmniOS</title>
<style>html,body{height:100%;margin:0;background:#0f0f11;color:#f4f4f5;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:grid;place-items:center}.load{width:min(420px,calc(100vw - 40px));text-align:center}.logo{font-size:28px;font-weight:800;letter-spacing:-.04em}.logo span{color:#06b6d4}.bar{height:5px;background:#27272a;border-radius:99px;overflow:hidden;margin:20px 0 10px}.fill{height:100%;width:8%;background:#06b6d4;border-radius:99px;transition:width .18s}.msg{font-size:13px;color:#a1a1aa;line-height:1.5}.err{color:#f87171}.retry{margin-top:14px;padding:9px 14px;border:1px solid #3f3f46;border-radius:8px;background:#27272a;color:#fff;cursor:pointer;display:none}</style>
</head>
<body>
<div class="load"><div class="logo">Omni<span>OS</span></div><div class="bar"><div class="fill" id="f"></div></div><div class="msg" id="m">Loading OmniOS…</div><button class="retry" id="r" onclick="location.reload()">Retry</button></div>
<script>
(async()=>{const files=['part-01.txt','part-02.txt','part-03.txt','part-04.txt','part-05.txt','part-06.txt','part-07.txt','part-08.txt'],f=document.getElementById('f'),m=document.getElementById('m'),r=document.getElementById('r');try{if(!('DecompressionStream'in window))throw new Error('Please use a recent Chrome, Edge, Firefox, or Safari.');let b64='';for(let i=0;i<files.length;i++){m.textContent=`Loading OmniOS… ${i+1}/${files.length}`;const res=await fetch(files[i],{cache:'force-cache'});if(!res.ok)throw new Error(`Could not load ${files[i]} (${res.status})`);b64+=(await res.text()).trim();f.style.width=`${10+Math.round((i+1)/files.length*60)}%`}const raw=atob(b64),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);m.textContent='Starting OmniOS…';f.style.width='82%';const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();f.style.width='100%';document.open();document.write(html);document.close()}catch(e){console.error(e);m.classList.add('err');m.textContent='OmniOS could not start: '+(e?.message||e);r.style.display='inline-block';f.style.width='100%'}})();
</script>
</body></html>
